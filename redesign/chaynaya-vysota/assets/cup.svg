<svg xmlns="http://www.w3.org/2000/svg" class="cup-art" viewBox="0 0 720 500" width="720" height="500" role="img" aria-labelledby="gaiwan-title">
  <title id="gaiwan-title">Прозрачная стеклянная гайвань с крышкой на чайной доске. За ней горы в тумане.</title>
  <defs>
    <linearGradient id="sky" x2=".88" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#f1e8d2"/><stop offset=".53" stop-color="#e5e7d3"/><stop offset="1" stop-color="#adbead"/>
    </linearGradient>
    <linearGradient id="near-ink" x2=".6" y2="1">
      <stop stop-color="#789383"/><stop offset="1" stop-color="#b1beaa"/>
    </linearGradient>
    <linearGradient id="board" x1="0" x2="1" y2=".3">
      <stop stop-color="#526455"/><stop offset=".59" stop-color="#67715c"/><stop offset="1" stop-color="#88917b"/>
    </linearGradient>
    <linearGradient id="glass-wall" x1="0" x2="1">
      <stop stop-color="#f9fff0" stop-opacity=".75"/><stop offset=".11" stop-color="#d7e6d5" stop-opacity=".32"/>
